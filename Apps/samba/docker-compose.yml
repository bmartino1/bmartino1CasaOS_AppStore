name: bmartino1-samba
services:
  app:
    image: "dperson/samba:latest"
    restart: unless-stopped
    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
      - "445:445/tcp"
    volumes:
      - "/DATA/Shared:/shares:rw"
    environment:
      TZ: "America/Chicago"
      USER: "shareuser;CHANGE_TO_UNIQUE_PASSWORD"
      SHARE: "Shared;/shares;no;no;no;shareuser"
      WORKGROUP: "WORKGROUP"
      NMBD: "false"
      USERID: "1000"
      GROUPID: "1000"
    command: -p
    x-casaos:
      envs:
        - container: "TZ"
          description:
            en_US: "Configure TZ using the upstream documentation"
        - container: "USER"
          description:
            en_US: "REQUIRED: change the example password before deployment; upstream semicolon-delimited user format."
        - container: "SHARE"
          description:
            en_US: "Share name;path;browseable;readonly;guest;allowed users per upstream dperson format. Verify share access."
        - container: "WORKGROUP"
          description:
            en_US: "Configure WORKGROUP using the upstream documentation"
        - container: "NMBD"
          description:
            en_US: "Set true for NetBIOS name service if desired."
        - container: "USERID"
          description:
            en_US: "Configure USERID using the upstream documentation"
        - container: "GROUPID"
          description:
            en_US: "Configure GROUPID using the upstream documentation"
      ports:
        - container: "137"
          description:
            en_US: "NetBIOS discovery"
        - container: "138"
          description:
            en_US: "NetBIOS datagram"
        - container: "139"
          description:
            en_US: "SMB legacy session"
        - container: "445"
          description:
            en_US: "SMB file sharing"
      volumes:
        - container: "/shares"
          description:
            en_US: "Host path /DATA/Shared; rw mount"
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  id: "com.bmartino1.samba"
  title:
    en_US: "Samba File Sharing"
  description:
    en_US: "Generic password-protected SMB file sharing for folders on the CasaOS host. Upstream: https://github.com/dperson/samba"
  tagline:
    en_US: "Windows, macOS and Linux SMB shares"
  developer: "dperson"
  author: "bmartino1"
  version: "latest"
  icon: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/samba.png"
  thumbnail: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/samba.png"
  category: "Networking"
  tips:
    before_install:
      en_US: "Change USER password before first start. Share folder UID/GID must allow access. Avoid exposing SMB to the internet. Cannot bind host ports 139/445 concurrently with Time Machine or host Samba. Uses same host-port family as Time Machine. Project documentation: https://github.com/dperson/samba"

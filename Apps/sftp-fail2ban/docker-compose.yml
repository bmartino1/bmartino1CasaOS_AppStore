name: bmartino1-sftp-fail2ban
services:
  app:
    image: "bmmbmm01/sftp2:latest"
    restart: "unless-stopped"
    hostname: "sftp"
    cap_add:
      - "NET_ADMIN"
      - "NET_RAW"
    ports:
      - "2222:22/tcp"
    volumes:
      - "/DATA/AppData/sftp-fail2ban/share:/home/admin/sftp:rw"
      - "/DATA/AppData/sftp-fail2ban:/config:rw"
    environment:
      TZ: "America/Chicago"
      AUTO_UPDATE: "suite"
      LOG_STREAMS: "auth,fail2ban"
      ADMIN_PASS: ""
      PUID: "0"
      PGID: "0"
      ADMIN_USER: "admin"
      DEBUG_TESTING: "false"
      TAIL_LOGS: "true"
      CLEAR_LOGS: "false"
      F2B_CONFIG_MODE: "symlink"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
      AUTO_UPDATE_INTERVAL_HOURS: "0"
      DEFAULT_ADMIN: "true"
      SFTP_USERS: ""
      PASSWORD_AUTH: "yes"
      ALLOW_USERS: ""
      DISABLE_IMKLOG: "true"
      MODE: "start"
      MAIL_SERVER: "false"
    x-casaos:
      envs:
        - container: "AUTO_UPDATE_INTERVAL_HOURS"
          description:
            en_US: "0 disables timed package updates; 24 checks approximately daily. Restart after OpenSSH upgrade."
        - container: "DEFAULT_ADMIN"
          description:
            en_US: "Set false to manage users.conf without environment synchronization."
        - container: "SFTP_USERS"
          description:
            en_US: "Optional user entries, see upstream README users.conf format; protect credentials."
        - container: "PASSWORD_AUTH"
          description:
            en_US: "Set no to require SSH keys configured beforehand."
        - container: "ALLOW_USERS"
          description:
            en_US: "Optional space-separated SSH username allowlist."
        - container: "DISABLE_IMKLOG"
          description:
            en_US: "Disable rsyslog imklog in containers."
        - container: "MODE"
          description:
            en_US: "start launches service; seed prepares configuration then exits."
        - container: "MAIL_SERVER"
          description:
            en_US: "Advanced: permit mail actions if configured."
        - container: "TZ"
          description:
            en_US: "Environment setting: TZ"
        - container: "AUTO_UPDATE"
          description:
            en_US: "true runs packaged updater, custom uses /config/updateapps.sh, false skips."
        - container: "LOG_STREAMS"
          description:
            en_US: "Environment setting: LOG_STREAMS"
        - container: "ADMIN_PASS"
          description:
            en_US: "REQUIRED: Set a unique password before first launch; CHANGE_ME_BEFORE_FIRST_START is a placeholder."
        - container: "PUID"
          description:
            en_US: "Environment setting: PUID"
        - container: "PGID"
          description:
            en_US: "Environment setting: PGID"
        - container: "ADMIN_USER"
          description:
            en_US: "Environment setting: ADMIN_USER"
        - container: "DEBUG_TESTING"
          description:
            en_US: "Environment setting: DEBUG_TESTING"
        - container: "TAIL_LOGS"
          description:
            en_US: "Environment setting: TAIL_LOGS"
        - container: "CLEAR_LOGS"
          description:
            en_US: "Environment setting: CLEAR_LOGS"
        - container: "F2B_CONFIG_MODE"
          description:
            en_US: "symlink, overlay, noclobber or replace."
      ports:
        - container: "22"
          description:
            en_US: "External SFTP/SSH port"
      volumes:
        - container: "/home/admin/sftp"
          description:
            en_US: "Example shared folder; adjust admin username/path as needed"
        - container: "/config"
          description:
            en_US: "SSH host keys, users, Fail2ban settings and logs"
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  id: "com.bmartino1.sftp-fail2ban"
  title:
    en_US: "SFTP-Fail2ban"
  description:
    en_US: "OpenSSH SFTP server with Fail2ban. Change the shared host path and match the container path user to ADMIN_USER/users.conf. Set a unique ADMIN_PASS before starting. Project source: https://github.com/bmartino1/sftp-debian"
  tagline:
    en_US: "SFTP access with brute-force protection"
  developer: "bmartino1"
  version: "latest"
  author: "bmartino1"
  icon: "https://raw.githubusercontent.com/bmartino1/unraid-docker-templates/main/images/SFTP.png"
  thumbnail: "https://raw.githubusercontent.com/bmartino1/unraid-docker-templates/main/images/SFTP.png"
  category: "Networking"
  tips:
    before_install:
      en_US: "No WebUI. Connect using an SFTP client on port 2222 by default. Change ADMIN_PASS and verify shared folder permissions and ADMIN_USER path before exposing the port. Source and full configuration documentation: https://github.com/bmartino1/sftp-debian"
